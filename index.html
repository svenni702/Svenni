<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kitchen Stock</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#eef1ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1513" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kitchen Stock">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;700&display=swap">
<style>
/* Layout: sticky header (title, search, tabs) over one long list grouped by storage place; sheet slides up for edits */
:root {
  --bg: #eef1ef; --surface: #ffffff; --ink: #16201c; --mute: #5d6b65; --line: #d9e0dc;
  --accent: #0f6b5c; --accent-ink: #ffffff; --out: #b8431a; --out-bg: #f7e6df;
  --fridge: #2b7bb9; --freezer: #5b5bd6; --cup: #a8731a; --shadow: 0 6px 24px rgba(10, 30, 24, .18);
  --font: "Schibsted Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1513; --surface: #182019; --ink: #e8efeb; --mute: #94a39b; --line: #27332e;
    --accent: #4cc2a8; --accent-ink: #06241d; --out: #f08a5d; --out-bg: #2c1d16;
    --fridge: #6bb4ea; --freezer: #9a9af0; --cup: #e0b25c; --shadow: 0 6px 24px rgba(0, 0, 0, .5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1513; --surface: #182019; --ink: #e8efeb; --mute: #94a39b; --line: #27332e;
  --accent: #4cc2a8; --accent-ink: #06241d; --out: #f08a5d; --out-bg: #2c1d16;
  --fridge: #6bb4ea; --freezer: #9a9af0; --cup: #e0b25c; --shadow: 0 6px 24px rgba(0, 0, 0, .5);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 96px;
}
.wrap { max-width: 640px; margin: 0 auto; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); padding-top: 12px; }
h1 { font-size: 22px; line-height: 1.1; margin: 0; font-weight: 700; letter-spacing: -.01em; }
.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.top small { color: var(--mute); font-size: 13px; }
.search { margin: 10px 0 8px; }
input, select, textarea, button { font: inherit; color: inherit; }
input[type=search], input[type=text], input[type=number], input[type=date], select, textarea {
  width: 100%; min-width: 0; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface);
}
textarea { resize: vertical; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tabs { display: flex; gap: 6px; overflow-x: auto; padding: 2px 0 10px; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 14px; font-weight: 500; font-size: 14px; cursor: pointer; }
.tab[aria-selected=true] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.tab .n { margin-left: 6px; font-variant-numeric: tabular-nums; opacity: .7; }
.group { margin-top: 18px; }
.group h2 { display: flex; align-items: center; gap: 8px; margin: 0 0 4px; font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--mute); }
.group h2::before { content: ""; width: 10px; height: 10px; border-radius: 3px; background: var(--c, var(--mute)); }
.group h2 span { margin-left: auto; font-variant-numeric: tabular-nums; font-weight: 500; letter-spacing: 0; }
.row { display: flex; align-items: center; gap: 6px; min-height: 60px; padding: 6px 0; border-bottom: 1px solid var(--line); -webkit-tap-highlight-color: transparent; }
.main { flex: 1; min-width: 0; }
.nm { font-weight: 500; overflow-wrap: anywhere; line-height: 1.25; }
.meta { font-size: 12.5px; color: var(--mute); margin-top: 2px; }
.qty { display: flex; align-items: baseline; gap: 4px; padding: 6px 10px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); white-space: nowrap; }
.qty i { font-style: normal; color: var(--mute); font-size: 13px; }
.qty b { font-size: 20px; font-variant-numeric: tabular-nums; line-height: 1; }
.qty span { font-size: 12.5px; color: var(--mute); }
.b { flex: none; min-width: 40px; height: 40px; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; font-weight: 700; cursor: pointer; padding: 0 10px; }
.b.tom { color: var(--out); font-size: 13px; }
.b.ed { color: var(--mute); border-color: transparent; background: transparent; min-width: 32px; padding: 0 4px; }
.row.out .nm { color: var(--mute); }
.tadd { display: flex; gap: 8px; margin: 4px 0 4px; }
.trow { display: flex; align-items: center; gap: 6px; min-height: 52px; padding: 4px 0; border-bottom: 1px solid var(--line); }
.tbox { flex: none; width: 40px; height: 40px; border: 0; background: none; padding: 0; display: grid; place-items: center; cursor: pointer; }
.tbox i { width: 24px; height: 24px; border: 2px solid var(--mute); border-radius: 6px; display: grid; place-items: center; color: transparent; }
.tbox i svg { width: 16px; height: 16px; }
.tbox[aria-pressed=true] i { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.ttext { flex: 1; min-width: 0; overflow-wrap: anywhere; line-height: 1.3; cursor: pointer; }
.trow.done .ttext { color: var(--mute); text-decoration: line-through; }
.trow .b[disabled] { opacity: .3; cursor: default; }
.tempty { color: var(--mute); margin: 10px 0 18px; }
#tstat.err { color: var(--out); }
.row.out .qty { background: var(--out-bg); border-color: transparent; }
.row.out .qty b { color: var(--out); }
.metaline { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 8px; margin-top: 3px; }
.metaline .meta { margin-top: 0; }
.cart { flex: none; width: 32px; height: 26px; border: 1px solid var(--line); background: var(--surface); color: var(--mute); border-radius: 8px; padding: 0; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
.cart[aria-pressed=true] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.cart svg { width: 16px; height: 16px; }
.chk { display: flex; gap: 10px; align-items: center; grid-column: 1 / -1; font-size: 15px; }
.chk input { width: 20px; height: 20px; accent-color: var(--accent); }
.empty { margin: 36px 0; color: var(--mute); text-align: center; line-height: 1.5; }
.fab { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 25; border: 0; background: var(--accent); color: var(--accent-ink); border-radius: 999px; padding: 14px 20px; font-weight: 700; box-shadow: var(--shadow); cursor: pointer; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(76px + env(safe-area-inset-bottom, 0px)); z-index: 40; display: flex; gap: 14px; align-items: center; background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: 12px; box-shadow: var(--shadow); max-width: calc(100% - 32px); font-size: 14px; }
.toast button { background: none; border: 0; color: inherit; font-weight: 700; text-decoration: underline; cursor: pointer; padding: 0; }
.scrim { position: fixed; inset: 0; z-index: 50; background: rgba(0, 0, 0, .45); display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 560px; max-height: 92%; overflow-y: auto; background: var(--surface); border-radius: 18px 18px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom, 0px)); }
.sheet h2 { margin: 0 0 12px; font-size: 18px; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid .full { grid-column: 1 / -1; }
label.f { display: block; font-size: 12.5px; color: var(--mute); }
label.f > :last-child { margin-top: 4px; color: var(--ink); }
.dwrap { display: flex; gap: 6px; }
.cal { position: relative; flex: none; width: 42px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); display: grid; place-items: center; font-size: 18px; }
.cal input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; padding: 0; border: 0; cursor: pointer; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 11px 16px; font-weight: 700; cursor: pointer; }
.btn.pri { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { color: var(--out); margin-left: auto; }
.btn[disabled] { opacity: .5; cursor: default; }
.hint { color: var(--mute); font-size: 13px; line-height: 1.45; margin: 8px 0 0; }
.rline { padding: 12px 0; border-bottom: 1px solid var(--line); display: grid; gap: 8px; }
.rline.skip { opacity: .45; }
.rhead { display: flex; gap: 10px; align-items: flex-start; }
.rhead input[type=checkbox] { width: 22px; height: 22px; margin-top: 1px; accent-color: var(--accent); flex: none; }
.rname { font-weight: 500; overflow-wrap: anywhere; }
.rsub { font-size: 12.5px; color: var(--mute); }
.tag { display: inline-block; font-size: 11.5px; font-weight: 700; padding: 1px 7px; border-radius: 6px; background: var(--line); color: var(--ink); margin-left: 6px; letter-spacing: .02em; }
.tag.new { background: var(--accent); color: var(--accent-ink); }
.rctl { display: grid; grid-template-columns: 1fr 96px; gap: 8px; align-items: end; }
.banner { margin: 12px 0 0; padding: 10px 12px; border-radius: 10px; background: var(--out-bg); color: var(--out); font-size: 14px; }
.filebtn { position: relative; overflow: hidden; }
.filebtn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; }
@media (prefers-reduced-motion: no-preference) { .toast, .sheet { animation: rise .16s ease-out; } @keyframes rise { from { opacity: 0; transform: translate(var(--tx, 0), 12px); } } .toast { --tx: -50%; } }

body { margin: 0; }
[hidden] { display: none !important; }
.linkb { height: 30px; min-width: 0; font-size: 13px; font-weight: 500; color: var(--mute); }
.top { align-items: center; }
.top small { margin-left: auto; }
.linkb.dirty { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
#filebar .banner { margin: 6px 0 0; background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
#filebar .banner.warn { background: var(--out-bg); color: var(--out); border-color: transparent; }
#filebar .fs { font-size: 12.5px; color: var(--mute); margin: 6px 0 0; }
#filebar .btns { margin-top: 10px; }
</style>

</head>
<body>
<div class="wrap">
  <header>
    <div class="top"><h1>Kitchen Stock</h1><small id="count"></small><button class="b linkb" id="savehtml" hidden>Save</button><button class="b linkb" id="syncbtn">Sync</button><button class="b linkb" id="backup">Backup</button></div>
    <div class="search"><input type="search" id="q" placeholder="Search items" aria-label="Search items"></div>
    <div class="tabs" id="tabs" role="tablist"></div>
  </header>
  <main><div id="filebar"></div>
    <div id="list"></div>
    <section id="rcpt" hidden>
      <div class="group"><h2 style="--c: var(--accent)">Add a receipt</h2></div>
      <textarea id="rtext" rows="7" placeholder="Paste the receipt text from the Kiwi app or e-mail here"></textarea>
      <div class="btns">
        <button class="btn pri" id="rread">Read text</button>
        <label class="btn filebtn" id="rimgwrap" hidden>Read screenshot (uses Claude)<input type="file" id="rfile" accept="image/*"></label>
      </div>
      <p class="hint">The text is read here with fixed rules, so it works offline. Copy the lines from the Kiwi app or the receipt e-mail, with the date and Kvitteringsnr. if you can.</p>
      <div id="rreview"></div>
    </section>
    <section id="todo" hidden>
      <form id="tform" class="tadd" autocomplete="off"><input type="text" id="tnew" placeholder="Add a reminder" aria-label="Add a reminder"><button class="btn pri" type="submit">Add</button></form>
      <p class="hint" id="tstat"></p>
      <div id="tlist"></div>
    </section>
  </main>
</div>
<button class="fab" id="fab">+ New item</button>
<div id="toastbox"></div>
<div id="sheetbox"></div>

<script>
/* Storage layer: the same calls the page used on claude.ai. Data lives in this browser; the Save button (Chrome/Edge) also writes it into this HTML file itself. */
(function () {
  var KEY = 'kitchen-stock-v1', TKEY = KEY + '-t';
  var EMBED = /*SEED-START*/{"savedAt":0,"data":{}}/*SEED-END*/;
  var data = null, lt = 0;
  try { data = JSON.parse(localStorage.getItem(KEY) || 'null'); lt = Number(localStorage.getItem(TKEY) || 0); } catch (e) { data = null; }
  if (data && !lt) { lt = Date.now(); try { localStorage.setItem(TKEY, String(lt)); } catch (e) { /* ignore */ } }  // older copy without a timestamp: keep what the browser has
  var unsaved = false;
  function cache() { try { localStorage.setItem(KEY, JSON.stringify(data)); localStorage.setItem(TKEY, String(lt)); } catch (e) { window.__ksNoSave = true; } }
  if (!data || typeof data !== 'object' || EMBED.savedAt > lt) { data = JSON.parse(JSON.stringify(EMBED.data)); lt = EMBED.savedAt; cache(); }  // the page file is newer than the browser copy (or the browser is empty)
  var syncOn = false; try { syncOn = !!localStorage.getItem('kitchen-stock-gh'); } catch (e) { /* ignore */ }
  if (EMBED.add && !syncOn) {  // items added to the page file that this browser copy does not have yet: add them without touching anything else
    var added = 0;
    Object.keys(EMBED.add).forEach(function (k) { if (!(k in data)) { data[k] = JSON.parse(JSON.stringify(EMBED.add[k])); added++; } });
    if (added) { lt = Math.max(lt, Date.now()); cache(); }
  }
  unsaved = lt > EMBED.savedAt;
  var subs = [];
  function notify() { setTimeout(function () { subs.slice().forEach(function (f) { f(); }); }, 0); }
  function kids(col) { return Object.keys(data).filter(function (k) { return k.indexOf(col + '/') === 0 && k.indexOf('/', col.length + 1) < 0; }); }
  function snap(k) { var d = data[k]; return { id: k.split('/').pop(), exists: d !== undefined, data: function () { return d === undefined ? undefined : JSON.parse(JSON.stringify(d)); } }; }
  function sub(f) { subs.push(f); notify(); return function () { subs = subs.filter(function (x) { return x !== f; }); }; }
  function persist() { lt = Date.now(); unsaved = true; cache(); button(); }

  /* ----- Save into the HTML file (Chrome / Edge) ----- */
  var canFS = typeof window.showOpenFilePicker === 'function' && !!window.indexedDB;
  var busy = false;
  var PICK = { types: [{ description: 'Kitchen Stock page', accept: { 'text/html': ['.html', '.htm'] } }] };
  function idb() { return new Promise(function (res, rej) { var r = indexedDB.open('kitchen-stock-fs', 1); r.onupgradeneeded = function () { r.result.createObjectStore('kv'); }; r.onsuccess = function () { res(r.result); }; r.onerror = function () { rej(r.error); }; }); }
  async function kvGet(k) { var d = await idb(); return new Promise(function (res) { var t = d.transaction('kv').objectStore('kv').get(k); t.onsuccess = function () { res(t.result); }; t.onerror = function () { res(null); }; }); }
  async function kvSet(k, v) { var d = await idb(); return new Promise(function (res, rej) { var t = d.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = res; t.onerror = function () { rej(t.error); }; }); }
  function marker() { return new RegExp('/\\*SEED-' + 'START\\*/[\\s\\S]*?/\\*SEED-' + 'END\\*/'); }
  function say(msg, bad) {
    var el = document.getElementById('filebar'); if (!el) return;
    el.innerHTML = msg ? (bad ? '<div class="banner warn"></div>' : '<p class="fs"></p>') : '';
    if (msg) el.firstChild.textContent = msg;
  }
  function button() {
    var b = document.getElementById('savehtml'); if (!b) return;
    if (gh && gh.token) { b.hidden = true; return; }
    b.hidden = false;
    b.textContent = busy ? 'Saving…' : unsaved ? (canFS ? 'Save ●' : 'Save copy ●') : 'Saved ✓';
    b.classList.toggle('dirty', unsaved && !busy);
  }
  async function write(handle) {
    var html = await (await handle.getFile()).text();
    var re = marker();
    if (!re.test(html)) throw new Error('That file is not the Kitchen Stock page. Choose kitchen-stock.html.');
    var T = lt;
    var block = '/*SEED-' + 'START*/' + JSON.stringify({ savedAt: T, data: data }).replace(/</g, '\\u003c') + '/*SEED-' + 'END*/';
    var w = await handle.createWritable();
    await w.write(html.replace(re, function () { return block; }));
    await w.close();
    EMBED.savedAt = T; unsaved = lt > T;
  }
  /* The page as it was loaded: the live copy of the document with the screens it drew cleared out, and the stock block refreshed. */
  function pageHtml(T) {
    var c = document.documentElement.cloneNode(true);
    ['tabs', 'list', 'rreview', 'filebar', 'sheetbox', 'toastbox', 'count', 'tlist', 'tstat'].forEach(function (id) { var e = c.querySelector('#' + id); if (e) e.textContent = ''; });
    ['rcpt', 'todo', 'rimgwrap', 'savehtml'].forEach(function (id) { var e = c.querySelector('#' + id); if (e) e.setAttribute('hidden', ''); });
    var sy = c.querySelector('#syncbtn'); if (sy) sy.textContent = 'Sync';
    ['fab'].forEach(function (id) { var e = c.querySelector('#' + id); if (e) e.removeAttribute('hidden'); });
    var s = c.querySelector('.search'); if (s) s.removeAttribute('hidden');
    var l = c.querySelector('#list'); if (l) l.removeAttribute('hidden');
    var t = c.querySelector('#rtext'); if (t) t.textContent = '';
    var sb = c.querySelector('#savehtml'); if (sb) { sb.textContent = 'Save'; sb.className = 'b linkb'; }
    var block = '/*SEED-' + 'START*/' + JSON.stringify({ savedAt: T, data: data }).replace(/</g, '\\u003c') + '/*SEED-' + 'END*/';
    return ('<!doctype html>\n' + c.outerHTML).replace(marker(), function () { return block; });
  }
  function downloadCopy() {
    var T = lt, html = pageHtml(T);
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([html], { type: 'text/html' }));
    a.download = 'kitchen-stock.html';
    document.body.appendChild(a); a.click(); a.remove();
    EMBED.savedAt = T; unsaved = lt > T;
    say('Downloaded kitchen-stock.html with your stock inside. Open that copy to use it, and delete the older one.');
    button();
  }
  async function saveToHtml(override) {
    if (busy) return;
    if (!canFS && !override) { downloadCopy(); return; }
    busy = true; button(); say('');
    try {
      var h = override || await kvGet('html');
      if (!h) {
        say('Choose this page’s file (kitchen-stock.html) so Save can update it.');
        h = (await window.showOpenFilePicker(PICK))[0];
        try { await kvSet('html', h); } catch (e) { /* remembering the file is a convenience */ }
      } else if (!override && (await h.queryPermission({ mode: 'readwrite' })) !== 'granted' && (await h.requestPermission({ mode: 'readwrite' })) !== 'granted') {
        throw new Error('Chrome did not give permission to edit the file.');
      }
      try { await write(h); }
      catch (e) {
        if (e && e.name === 'NotFoundError') { try { await kvSet('html', null); } catch (e2) { /* ignore */ } throw new Error('The page file moved. Press Save again and choose it.'); }
        throw e;
      }
      var d = new Date();
      say('Saved into ' + (h.name || 'the page file') + ' at ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'));
    } catch (e) {
      if (!(e && e.name === 'AbortError')) say(String((e && e.message) || e), true); else say('');
    }
    busy = false; button();
  }
  /* ----- Sync between devices: the stock lives in stock.json on the "data" branch of the GitHub repo ----- */
  var GH_KEY = 'kitchen-stock-gh', DK = 'kitchen-stock-dirty';
  var GH_DEFAULT = { repo: 'svenni702/Svenni-data', branch: 'main', path: 'stock.json' };  // private repo: only tokens with access can read it
  var gh = null, dirty = { set: {}, del: {} }, syncing = false, syncT = null, lastErr = '', ghSha = null, hadErr = false;
  try { gh = JSON.parse(localStorage.getItem(GH_KEY) || 'null'); dirty = JSON.parse(localStorage.getItem(DK) || 'null') || dirty; } catch (e) { /* ignore */ }
  if (gh && (gh.repo !== GH_DEFAULT.repo || gh.branch !== GH_DEFAULT.branch)) {  // devices set up before the stock moved to the private repo
    gh.repo = GH_DEFAULT.repo; gh.branch = GH_DEFAULT.branch; gh.path = GH_DEFAULT.path;
    try { localStorage.setItem(GH_KEY, JSON.stringify(gh)); } catch (e) { /* ignore */ }
  }
  function saveDirty() { try { localStorage.setItem(DK, JSON.stringify(dirty)); } catch (e) { /* ignore */ } }
  function pending() { return Object.keys(dirty.set).length + Object.keys(dirty.del).length; }
  function mark(k, gone) {
    if (gone) { dirty.del[k] = (dirty.del[k] || 0) + 1; delete dirty.set[k]; }
    else { dirty.set[k] = (dirty.set[k] || 0) + 1; delete dirty.del[k]; }
    saveDirty(); schedule();
  }
  function syncUi() {
    var b = document.getElementById('syncbtn'); if (!b) return;
    var on = !!(gh && gh.token);
    b.textContent = !on ? 'Set up sync' : syncing ? 'Syncing…' : lastErr ? 'Sync ⚠' : pending() ? 'Sync ●' : 'Synced ✓';
    b.title = lastErr || '';
    b.classList.toggle('dirty', on && !syncing && (!!lastErr || pending() > 0));
  }
  function enc(str) { return btoa(unescape(encodeURIComponent(str))); }

    else if (act === 'out') setQty(it.id, 0, it.shop ? null : { label: 'Add to list', fn: function () { setShop(it.id, true); } });
    else if (act === 'list') setShop(it.id, !it.shop);
    else if (act === 'edit') openSheet(it.id);
  });

  /* ---------- storage ---------- */
  var savedTab = store('ks-tab'); if (savedTab && TABS.some(function (t) { return t[0] === savedTab; })) state.tab = savedTab;
  tdSync();
  render();
  try { state.db = window.claude && window.claude.use ? await window.claude.use('db') : null; } catch (e) { state.db = null; }
  if (!state.db) { state.loaded = true; render(); return; }
  state.db.collection('items').onSnapshot(function (snap) {
    var next = new Map();
    snap.docs.forEach(function (d) {
      var data = d.data() || {}, id = d.id, old = state.items.get(id);
      var it = Object.assign({ id: id, name: '', loc: 'Fridge', cat: '', qty: 0, unit: 'stk', step: 0, best: '', bought: '', updated: '', shop: false }, data);
      if (old && (running.has(id) || pending.has(id))) { it.qty = old.qty; it.shop = old.shop; it.bought = old.bought; it.updated = old.updated; }
      next.set(id, it);
    });
    state.items = next; state.loaded = true; render();
    if (state.rcpt) { /* keep the review the user is editing */ }
  }, function () { state.loaded = true; render(); });
  state.db.collection('aliases').onSnapshot(function (snap) {
    var m = new Map(); snap.docs.forEach(function (d) { var x = d.data(); if (x && x.key) m.set(x.key, x); }); state.aliases = m;
  });
  state.db.doc('meta/receipts').onSnapshot(function (d) { var x = d.exists ? d.data() : null; state.receipts = (x && x.numbers) || []; });
})();
</script>
<script>
(function () {
  var box = document.getElementById('sheetbox');
  function close() { box.innerHTML = ''; }
  function stamp() { var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  document.getElementById('backup').onclick = function () {
    var fn = window.__ks.fileName();
    box.innerHTML = '<div class="scrim" id="scrim"><div class="sheet"><h2>Backup</h2>' +
      '<p class="hint" style="margin-top:0">Your stock is kept inside this browser. The Save button also writes it into this page’s own file. ' +
      'A backup file is a separate copy you can keep somewhere safe.' +
      (window.__ksNoSave ? ' <b>This browser is blocking storage, so changes will not be kept.</b>' : '') + '</p>' +
      '<div class="btns"><button class="btn pri" id="bk-export">Save backup file</button>' +
      '<label class="btn filebtn">Restore from file<input type="file" id="bk-import" accept=".json,application/json"></label>' +
      '<button class="btn" id="bk-close">Close</button></div><p class="hint" id="bk-msg"></p></div></div>';
    if (fn) box.querySelector('.hint b').textContent = fn;
    document.getElementById('scrim').onclick = function (e) { if (e.target.id === 'scrim') close(); };
    document.getElementById('bk-close').onclick = close;
    document.getElementById('bk-export').onclick = function () {
      var a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([window.__ks.dump()], { type: 'application/json' }));
      a.download = 'kitchen-stock-backup-' + stamp() + '.json';
      document.body.appendChild(a); a.click(); a.remove();
      document.getElementById('bk-msg').textContent = 'Saved ' + a.download + ' to your downloads.';
    };
    document.getElementById('bk-import').onchange = function (e) {
      var f = e.target.files && e.target.files[0]; if (!f) return;
      var r = new FileReader();
      r.onload = function () {
        var msg = document.getElementById('bk-msg');
        try {
          var obj = JSON.parse(r.result);
          if (!obj || obj.app !== 'kitchen-stock' || typeof obj.data !== 'object') throw 0;
          var n = Object.keys(obj.data).filter(function (k) { return k.indexOf('items/') === 0; }).length;
          msg.innerHTML = 'This file has ' + n + ' items and will replace everything now in the app. <button class="btn pri" id="bk-yes" style="margin-top:8px">Replace</button>';
          document.getElementById('bk-yes').onclick = function () { window.__ks.load(obj.data); close(); };
        } catch (err) { msg.textContent = 'That file is not a Kitchen Stock backup.'; }
      };
      r.readAsText(f);
    };
  };
})();
</script>
<script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () { /* the page still works without it */ });</script>
